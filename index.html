<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKP7 Pro Solutions - ระบบลงทะเบียนข้อมูลลูกค้าวงจรที่ 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .bg-custom-image { background-image: linear-gradient(rgba(40, 10, 25, 0.85), rgba(60, 15, 35, 0.85)), url('https://hebbkx1anhila5yf.public.blob.vercel-storage.com/1785518472043.jpg-F1j1Wn3LhRz6UaN6cR2fX9PqMv8W4p.jpeg'); background-size: cover; background-position: center; background-attachment: fixed; }
        .glass-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); }
        @media print { body { background: white !important; } header, footer, button, .no-print { display: none !important; } .print-sheet { display: block !important; } }
        .print-sheet { display: none; }
    </style>
</head>
<body class="h-full bg-custom-image text-slate-800 antialiased">

    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md">
        <div class="glass-card rounded-2xl p-8 max-w-sm w-full mx-4 text-center border border-pink-200">
            <h2 class="text-xl font-bold mb-6">เข้าสู่ระบบ TKP7 Pro</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="email" id="loginEmail" required placeholder="E-mail" class="w-full px-4 py-3 border rounded-xl">
                <button type="submit" class="w-full py-3 bg-pink-600 text-white font-bold rounded-xl">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <div id="app" class="min-h-full flex flex-col hidden">
        <header class="bg-slate-900/80 p-4 sticky top-0 z-30 no-print border-b border-pink-500/20">
            <div class="max-w-7xl mx-auto flex justify-between items-center text-white">
                <h1 class="font-bold">TKP7 Pro Solutions (วงจรที่ 2)</h1>
                <div class="flex gap-2">
                    <button onclick="switchTab('form')" class="px-3 py-1 bg-pink-600 rounded">ลงทะเบียน</button>
                    <button id="nav-list" onclick="switchTab('list')" class="hidden px-3 py-1 bg-white/10 rounded">รายการ</button>
                    <button id="nav-pricing" onclick="switchTab('pricing')" class="hidden px-3 py-1 bg-white/10 rounded">กำหนดราคา</button>
                    <button onclick="handleLogout()" class="px-3 py-1 bg-rose-600 rounded">ออก</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
            <!-- TAB: FORM -->
            <div id="tab-form" class="glass-card p-6 rounded-2xl shadow-lg border border-pink-200">
                <form id="customerForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="custName" required placeholder="ชื่อลูกค้า" class="px-4 py-3 border rounded-xl text-sm">
                        <input type="tel" id="custPhone" required placeholder="เบอร์โทร" class="px-4 py-3 border rounded-xl text-sm">
                        <input type="email" id="custEmail" readonly class="px-4 py-3 bg-slate-100 border rounded-xl text-sm">
                        <select id="custService" required onchange="calculateTotal()" class="px-4 py-3 border rounded-xl text-sm"><option value="">-- เลือกอุปกรณ์ --</option></select>
                        <select id="custWire" onchange="calculateTotal()" class="px-4 py-3 border rounded-xl text-sm"></select>
                        <input type="number" id="custDistanceInput" value="0" oninput="calculateTotal()" class="px-4 py-3 border rounded-xl text-sm">
                        <select id="custWarranty" onchange="calculateTotal()" class="px-4 py-3 border rounded-xl text-sm"></select>
                    </div>
                    <textarea id="custAddress" required placeholder="ที่อยู่" class="w-full px-4 py-3 border rounded-xl text-sm"></textarea>
                    
                    <div class="p-4 bg-pink-50 rounded-xl space-y-2">
                        <div class="flex justify-between font-bold text-pink-900"><span>ราคารวมทั้งสิ้น</span> <span id="displayTotalPrice">0.00 บาท</span></div>
                        <div id="basePackagesBreakdown" class="hidden text-xs text-slate-600 pt-2 border-t border-pink-200">
                            <span class="font-bold block mb-1">แพ็คเกจพื้นฐานที่รวมอยู่:</span>
                            <div id="basePackagesList" class="flex flex-wrap gap-2"></div>
                        </div>
                    </div>
                    <button type="submit" id="submitBtn" class="w-full py-3 bg-pink-600 text-white font-bold rounded-xl">บันทึกข้อมูลลูกค้า</button>
                </form>
            </div>

            <!-- TAB: LIST -->
            <div id="tab-list" class="hidden glass-card p-6 rounded-2xl shadow-lg border border-pink-200">
                <table class="w-full text-left"><tbody id="customerTableBody"></tbody></table>
            </div>

            <!-- TAB: PRICING -->
            <div id="tab-pricing" class="hidden space-y-6">
                <!-- ตารางกำหนดราคาต่างๆ (ใส่เหมือนที่เคยทำไว้) -->
            </div>
        </main>
        <div id="printContainer" class="print-sheet"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = 'tkp7-circuit2-app';
        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyAMGnd8SAeLeEjSC7jYHjthLxvrhVhyaK0",
            authDomain: "tkp7-pro.firebaseapp.com",
            projectId: "tkp7-pro",
            storageBucket: "tkp7-pro.firebasestorage.app",
            messagingSenderId: "297986344649",
            appId: "1:297986344649:web:df93a1ddaa6887488b6f18"
        }));

        window.handleLogin = (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            sessionStorage.setItem('tkp7_logged_in', 'true');
            sessionStorage.setItem('tkp7_user_email', email);
            sessionStorage.setItem('tkp7_user_role', email === 'tanthaizero@gmail.com' ? 'admin' : 'customer');
            location.reload();
        };

        async function populateFormDropdowns() {
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'equipment_pricing_basic'));
            let html = '<option value="">-- เลือกแบรนด์อุปกรณ์ --</option>';
            snap.forEach(d => {
                const item = d.data();
                const sumPrice = (parseFloat(item.amount) || 0) + (parseFloat(item.circuitPrice) || 0);
                html += `<option value="${item.brand}" data-price="${sumPrice}">${item.brand} (${sumPrice.toLocaleString()} ฿)</option>`;
            });
            document.getElementById('custService').innerHTML = html;
        }

        window.calculateTotal = async () => {
            let basePkgSum = 0;
            let basePkgNamesHtml = '';
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'base_package_pricing'));
            snap.forEach(d => {
                const p = d.data();
                basePkgSum += parseFloat(p.pkgPrice) || 0;
                basePkgNamesHtml += `<span class="bg-white/80 px-2 py-1 rounded border border-pink-200 text-pink-800 text-xs mr-2 mb-2 inline-block">${p.pkgName}: ${p.pkgPrice} ฿</span>`;
            });
            document.getElementById('basePackagesList').innerHTML = basePkgNamesHtml;
            document.getElementById('basePackagesBreakdown').classList.remove('hidden');

            const dist = parseFloat(document.getElementById('custDistanceInput').value) || 0;
            const wirePrice = parseFloat(document.getElementById('custWire').value) || 0;
            const servicePrice = document.getElementById('custService').selectedIndex > 0 ? parseFloat(document.getElementById('custService').options[document.getElementById('custService').selectedIndex].getAttribute('data-price')) : 0;
            
            const total = basePkgSum + (dist * wirePrice) + servicePrice;
            document.getElementById('displayTotalPrice').textContent = total.toLocaleString('th-TH', { minimumFractionDigits: 2 }) + ' บาท';
            return total;
        };

        window.loadCustomers = async () => {
            const role = sessionStorage.getItem('tkp7_user_role');
            const email = sessionStorage.getItem('tkp7_user_email');
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'customers_circuit_2'));
            const tbody = document.getElementById('customerTableBody');
            tbody.innerHTML = '';
            snap.forEach(d => {
                const cust = d.data();
                if(role === 'admin' || cust.email === email) {
                    tbody.innerHTML += `<tr><td class="py-3 px-4">${cust.name}<br>${cust.phone}</td><td class="py-3 px-4">${cust.installStatus}</td><td class="py-3 px-4">${cust.service}</td><td class="py-3 px-4">${Number(cust.totalPrice).toLocaleString()} ฿</td><td class="py-3 px-4 text-center"><button onclick="printSpecificCustomer('${d.id}')" class="px-3 py-1 bg-indigo-600 text-white rounded">พิมพ์</button> ${role === 'admin' ? `<button onclick="deleteCust('${d.id}')" class="px-3 py-1 bg-rose-600 text-white rounded">ลบ</button>` : ''}</td></tr>`;
                }
            });
        };
        
        // ... (เพิ่มฟังก์ชัน generatePrintHTML และส่วนที่เหลือตามโค้ดก่อนหน้า)
    </script>
</body>
</html>
