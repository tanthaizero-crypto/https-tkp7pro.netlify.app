<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKP7 Pro Solutions - ระบบลงทะเบียนข้อมูลลูกค้าวงจรที่ 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'], } } } }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .bg-custom-image { background-image: linear-gradient(rgba(40, 10, 25, 0.85), rgba(60, 15, 35, 0.85)), url('https://hebbkx1anhila5yf.public.blob.vercel-storage.com/1785518472043.jpg-F1j1Wn3LhRz6UaN6cR2fX9PqMv8W4p.jpeg'); background-size: cover; background-position: center; background-attachment: fixed; }
        .glass-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); }
        .print-sheet { display: none; }
        @media print { body { background: white !important; } header, .no-print { display: none !important; } .print-sheet { display: block !important; } }
    </style>
</head>
<body class="h-full bg-custom-image text-slate-800 antialiased">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md">
        <div class="glass-card rounded-2xl shadow-2xl max-w-md w-full mx-4 p-8 border border-pink-300/40 text-center">
            <h2 class="text-2xl font-bold mb-6">TKP7 Pro Solutions</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="email" id="loginEmail" required placeholder="E-mail" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-pink-500">
                <button type="submit" class="w-full py-3 bg-pink-600 text-white font-bold rounded-xl shadow-lg">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="min-h-full flex flex-col hidden">
        <header class="bg-slate-900/80 p-4 sticky top-0 z-30 no-print">
            <div class="max-w-7xl mx-auto flex justify-between items-center text-white">
                <h1 class="font-bold">TKP7 Pro Solutions (วงจรที่ 2)</h1>
                <div class="flex gap-2">
                    <button onclick="switchTab('form')" class="px-3 py-1 bg-pink-600 rounded">ลงทะเบียน</button>
                    <button id="nav-list" onclick="switchTab('list')" class="hidden px-3 py-1 bg-white/10 rounded">รายการ</button>
                    <button id="nav-pricing" onclick="switchTab('pricing')" class="hidden px-3 py-1 bg-white/10 rounded">กำหนดราคา</button>
                    <button onclick="handleLogout()" class="px-3 py-1 bg-rose-600 rounded">ออก</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
            <!-- FORM TAB -->
            <div id="tab-form" class="glass-card p-8 rounded-2xl shadow-lg border border-pink-200">
                <form id="customerForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold mb-2">ชื่อ - นามสกุลลูกค้า</label>
                            <input type="text" id="custName" required class="w-full px-4 py-3 border rounded-xl">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2">เบอร์โทรศัพท์</label>
                            <input type="tel" id="custPhone" required class="w-full px-4 py-3 border rounded-xl">
                        </div>
                        <!-- ช่อง E-mail แสดงอัตโนมัติ -->
                        <div>
                            <label class="block text-sm font-semibold mb-2">E-mail (อีเมลของคุณ)</label>
                            <input type="email" id="custEmail" readonly class="w-full px-4 py-3 bg-slate-100 border rounded-xl text-slate-500">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2">แบรนด์อุปกรณ์</label>
                            <select id="custService" required onchange="calculateTotal()" class="w-full px-4 py-3 border rounded-xl"><option value="">-- เลือกแบรนด์ --</option></select>
                        </div>
                    </div>
                    <button type="submit" id="submitBtn" class="w-full py-4 bg-pink-600 text-white font-bold rounded-xl">บันทึกข้อมูลลูกค้า</button>
                </form>
            </div>
            
            <!-- LIST & PRICING TABS (Hidden by default) -->
            <div id="tab-list" class="hidden glass-card p-6 rounded-2xl"><table class="w-full"><tbody id="customerTableBody"></tbody></table></div>
            <div id="tab-pricing" class="hidden glass-card p-6 rounded-2xl">...</div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMGnd8SAeLeEjSC7jYHjthLxvrhVhyaK0",
            authDomain: "tkp7-pro.firebaseapp.com",
            projectId: "tkp7-pro",
            storageBucket: "tkp7-pro.firebasestorage.app",
            messagingSenderId: "297986344649",
            appId: "1:297986344649:web:df93a1ddaa6887488b6f18"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            sessionStorage.setItem('tkp7_logged_in', 'true');
            sessionStorage.setItem('tkp7_user_email', email);
            if(email === 'tanthaizero@gmail.com') sessionStorage.setItem('tkp7_user_role', 'admin');
            unlockApp();
        };

        function unlockApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            // ใส่ค่าอีเมลลงช่องอัตโนมัติ
            document.getElementById('custEmail').value = sessionStorage.getItem('tkp7_user_email');
            
            if(sessionStorage.getItem('tkp7_user_role') === 'admin') {
                document.getElementById('nav-list').classList.remove('hidden');
                document.getElementById('nav-pricing').classList.remove('hidden');
            }
            populateFormDropdowns();
        }

        async function populateFormDropdowns() {
            const serviceSelect = document.getElementById('custService');
            const snap = await getDocs(collection(db, 'artifacts', 'tkp7-circuit2-app', 'public', 'data', 'equipment_pricing_basic'));
            let html = '<option value="">-- เลือกแบรนด์อุปกรณ์ --</option>';
            snap.forEach(d => {
                const item = d.data();
                html += `<option value="${item.brand}">${item.brand}</option>`;
            });
            serviceSelect.innerHTML = html;
        }

        window.handleFormSubmit = async (e) => {
            e.preventDefault();
            const newCustomer = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                email: document.getElementById('custEmail').value,
                service: document.getElementById('custService').value,
                createdAt: new Date().toISOString()
            };
            await addDoc(collection(db, 'artifacts', 'tkp7-circuit2-app', 'public', 'data', 'customers_circuit_2'), newCustomer);
            alert('บันทึกสำเร็จ!');
            document.getElementById('customerForm').reset();
            document.getElementById('custEmail').value = sessionStorage.getItem('tkp7_user_email');
        };

        window.handleLogout = () => { sessionStorage.clear(); location.reload(); };
        window.switchTab = (tab) => { /* logic to toggle tabs */ };
    </script>
</body>
</html>
